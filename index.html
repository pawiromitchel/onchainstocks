<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="See your Coinbase tokenized stock balances on Base. Connect any EVM wallet or look up an address or ENS name, view only." />
    <meta name="author" content="Mitchel" />
    <meta name="application-name" content="Onchain Stocks" />
    <meta name="apple-mobile-web-app-title" content="Onchain Stocks" />
    <link rel="canonical" href="https://onchainstocks.pawiromitchel.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Onchain Stocks" />
    <meta property="og:title" content="Onchain Stocks: your Coinbase tokenized stocks on Base" />
    <meta property="og:description" content="See your Coinbase tokenized stock balances on Base. Connect any EVM wallet or look up an address or ENS name, view only." />
    <meta property="og:url" content="https://onchainstocks.pawiromitchel.com/" />
    <meta property="og:image" content="https://onchainstocks.pawiromitchel.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Onchain Stocks: Only your stocks. Nothing else. Coinbase tokenized stocks, Base only." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Onchain Stocks: your Coinbase tokenized stocks on Base" />
    <meta name="twitter:description" content="See your Coinbase tokenized stock balances on Base. Connect any EVM wallet or look up an address or ENS name, view only." />
    <meta name="twitter:image" content="https://onchainstocks.pawiromitchel.com/og.png" />
    <meta name="twitter:image:alt" content="Onchain Stocks: Only your stocks. Nothing else. Coinbase tokenized stocks, Base only." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Onchain Stocks",
        "url": "https://onchainstocks.pawiromitchel.com/",
        "description": "See your Coinbase tokenized stock balances on Base. Connect any EVM wallet or look up an address or ENS name, view only.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Mitchel", "url": "https://pawiromitchel.com/" }
      }
    </script>
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Data sources: open the connections while the app downloads. -->
    <link rel="preconnect" href="https://api.dexscreener.com" crossorigin />
    <link rel="preconnect" href="https://base-rpc.publicnode.com" crossorigin />
    <link rel="dns-prefetch" href="https://metadata.coinbase.com" />
    <!-- Fonts load without blocking the first paint (display=swap shows fallback text meanwhile). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" /></noscript>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
  </head>
  <body>
    <!--
      Static first paint. This header (and the landing headline) shows as soon as the HTML and CSS
      arrive, instead of a blank page while ~180 KB of JavaScript downloads. React replaces it on
      mount. Keep it in sync with Header.tsx and Landing.tsx; the "static shell" e2e test checks it.
    -->
    <div id="root">
      <div class="shell">
        <header class="header">
          <a class="brand" href="#/" aria-label="Onchain Stocks home"><span class="brand-mark"></span><span class="brand-name">Onchain Stocks</span></a>
          <nav class="nav" aria-label="Main">
            <a href="#/" data-nav="home">Portfolio</a><a href="#/stocks" data-nav="stocks">Stocks</a><a href="#/about" data-nav="about">About</a>
          </nav>
          <div class="header-actions">
            <button class="icon-btn" aria-label="Switch theme"><svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg><svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg></button>
            <button class="btn" data-shell-connect><span class="long">Connect wallet</span><span class="short">Connect</span></button>
          </div>
        </header>
        <main data-shell-hero>
          <div class="hero-grid">
            <div class="hero">
              <span class="tag"><i class="dot-base"></i>Coinbase-issued tokenized stocks · Base only</span>
              <h1>Only your stocks. <em>Nothing else.</em></h1>
              <p class="lede">
                Connect any EVM wallet and see your Coinbase tokenized stock balances on Base in one clean list, with a buy
                link next to each one. Other chains and other issuers are not supported.
              </p>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script>
      // Fit the static shell to where the app will land, so nothing jumps when React takes over.
      (function () {
        var hash = location.hash, page = (hash.match(/^#\/([^/]*)/) || [])[1] || '';
        var connected = false;
        try { connected = !!(JSON.parse(localStorage.getItem('wagmi.store') || 'null') || {}).state.current; } catch (e) {}
        var nav = page === 'stock' ? 'stocks' : page === 'view' || page === '' ? 'home' : page;
        var link = document.querySelector('[data-nav="' + nav + '"]');
        if (link) link.setAttribute('aria-current', 'page');
        if (connected) document.querySelector('[data-shell-connect]').remove();
        var hero = !connected && page === '';
        if (!hero) document.querySelector('[data-shell-hero]').remove();
        document.documentElement.dataset.shell = hero ? 'hero' : 'bare';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
